# Docker compose for self-hosted real registries used in Checkpoint G.
#
# These are not mocks — Apicurio Registry and MLflow are real production
# software (Apicurio is Red Hat / CNCF-adjacent; MLflow is the Databricks
# OSS standard). Running them under compose gives us deterministic
# Postgres and MySQL backends to exercise APIWright's db_verify against.
#
# Up:    docker compose -f docker/docker-compose.yml up -d --wait
# Down:  docker compose -f docker/docker-compose.yml down -v
#
# Healthchecks are configured so `--wait` blocks until the registries
# are ready. The Postgres/MySQL services run on non-default ports so
# they don't conflict with anything on the host.

services:
  # --- Apicurio Registry stack (Postgres backend) -------------------------
  apicurio-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: apicurio
      POSTGRES_USER: apicurio
      POSTGRES_PASSWORD: apicurio
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apicurio"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - apicurio_pg:/var/lib/postgresql/data

  apicurio:
    image: apicurio/apicurio-registry:3.0.6
    depends_on:
      apicurio-postgres:
        condition: service_healthy
    environment:
      APICURIO_STORAGE_KIND: sql
      APICURIO_STORAGE_SQL_KIND: postgresql
      APICURIO_DATASOURCE_URL: jdbc:postgresql://apicurio-postgres:5432/apicurio  # gitleaks:allow — local Docker compose only; literal default credentials below
      APICURIO_DATASOURCE_USERNAME: apicurio
      APICURIO_DATASOURCE_PASSWORD: apicurio
    ports:
      - "58080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/apis/registry/v3/system/info"]
      interval: 5s
      timeout: 5s
      retries: 60

  # --- MLflow tracking server (MySQL backend) ----------------------------
  mlflow-mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: mlflow
      MYSQL_DATABASE: mlflow
      MYSQL_USER: mlflow
      MYSQL_PASSWORD: mlflow
    ports:
      - "53306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "mlflow", "-pmlflow"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - mlflow_mysql:/var/lib/mysql

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    depends_on:
      mlflow-mysql:
        condition: service_healthy
    command: >
      mlflow server
        --backend-store-uri mysql+pymysql://mlflow:mlflow@mlflow-mysql:3306/mlflow
        --default-artifact-root /tmp/mlflow-artifacts
        --host 0.0.0.0
        --port 5000
    ports:
      - "55000:5000"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:5000/health"]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  apicurio_pg:
  mlflow_mysql:
