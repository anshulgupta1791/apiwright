# Minimal valid OpenAPI 3.1 spec used by Checkpoint H to verify the
# `apiwright import openapi` flow end-to-end. Targets httpbin.org so the
# resulting endpoint JSONs can be run against a real public API.
openapi: 3.1.0
info:
  title: APIWright E2E Sample API
  version: 1.0.0
  description: |
    Minimal three-endpoint OpenAPI spec used by Checkpoint H to exercise
    the OpenAPI → canonical importer end-to-end. Real public targets
    (httpbin.org) so the generated endpoint JSONs can be run live.
servers:
  - url: https://httpbin.org
paths:
  /get:
    get:
      operationId: getEcho
      summary: Echo back request metadata
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [url, headers]
                properties:
                  url:
                    type: string
                  headers:
                    type: object
  /post:
    post:
      operationId: postEcho
      summary: Echo back posted body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hello]
              properties:
                hello:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
  /status/{code}:
    get:
      operationId: statusCode
      summary: Return any HTTP status
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: integer
            minimum: 100
            maximum: 599
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
        "500":
          description: Server Error
