# Environment: jsonplaceholder
#
# Targets https://jsonplaceholder.typicode.com — a free, no-auth REST
# placeholder service with stable CRUD endpoints (posts, comments,
# albums, photos, todos, users). Responses are deterministic; writes
# return 201 with a synthesized id but do not actually persist (the
# service is a read-only mirror with simulated write semantics).
#
# Used in Checkpoint B to exercise:
#   - the auto-generated §3 catalog (status_code_conformance,
#     response_schema_validation, method_not_allowed, malformed_json,
#     boundary_battery, idempotency)
#   - templating with ${request.body.*} interpolated into URLs
#   - response_time_sla against a well-behaved public API

name: jsonplaceholder
prod: false
base_url: https://jsonplaceholder.typicode.com
default_sla_ms: 3000
