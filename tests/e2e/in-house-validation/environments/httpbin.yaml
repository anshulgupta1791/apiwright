# Environment: httpbin
#
# Targets the public https://httpbin.org service. No auth, no rate limits —
# httpbin is specifically designed for HTTP behaviour testing, which makes
# it the ideal first target for Checkpoint A of the in-house E2E suite:
# every status code, every method, every auth mode, every delay is hittable
# on demand, with stable response shapes that schema validation can rely on.
#
# This environment file is committed; it has no secrets because httpbin
# accepts anonymous traffic. A real user testing a real registry would
# reference `${secret.*}` here for credentials.

name: httpbin
prod: false
base_url: https://httpbin.org

# Generous default SLA because httpbin is hosted off our infrastructure
# and round-trip latency from a CI runner can spike. Per-endpoint SLAs
# are tighter where the assertion is meaningful (e.g., /get must answer
# in 2s; /delay/1 endpoint overrides to 3s).
default_sla_ms: 3000
