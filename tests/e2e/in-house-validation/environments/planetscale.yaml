# Environment: planetscale
#
# Targets PlanetScale (free tier MySQL via their HTTPS query API +
# standard MySQL driver for db_verify). Sign up at planetscale.com,
# create a dev DB, generate a password.
#
# Used in Checkpoint F to exercise the MySQL connector via db_verify.
# PlanetScale offers an HTTPS query gateway; this env targets it as the
# API under test while the same DB is verified via the MySQL connector.
#
# Credential setup:
#   1. planetscale.com → create dev DB → generate password
#   2. Capture connection URL: mysql://user:pass@host/database?ssl=true
#   3. Set APIWRIGHT_E2E_MYSQL_URI to that URL

name: planetscale
prod: false
base_url: https://aws.connect.psdb.cloud
default_sla_ms: 8000

databases:
  primary_mysql:
    type: mysql
    uri: ${secret.APIWRIGHT_E2E_MYSQL_URI}
