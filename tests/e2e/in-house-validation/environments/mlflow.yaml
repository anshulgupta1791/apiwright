# Environment: mlflow
#
# Targets MLflow tracking server running locally under
# `docker/docker-compose.yml`. MLflow is the OSS model-registry standard
# (Databricks-led). This checkpoint exercises real registry semantics
# (experiment + run + artifact) AND verifies the MySQL backend state
# via db_verify queries.
#
# Used in Checkpoint G to exercise:
#   - MySQL db_verify (expect exists / match)
#   - cleanup blocks
#   - real registry workflow shapes (experiment_id → run_id chaining)

name: mlflow
prod: false
base_url: http://localhost:55000
default_sla_ms: 10000

databases:
  primary_mysql:
    type: mysql
    host: localhost
    port: 53306
    database: mlflow
    user: mlflow
    password: mlflow
