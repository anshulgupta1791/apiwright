# Environment: github-pat
#
# Targets https://api.github.com authenticated with a fine-grained
# personal access token scoped to ONE test repo (per GitHub issue #25's
# safety guideline). Used in Checkpoint D to exercise:
#   - static_token auth strategy (Authorization: Bearer)
#   - the catalog's no_auth_returns_401 + garbage_token_returns_401
#     auto-generated negative-auth tests
#   - console redaction of the PAT under --log=debug (Fix #1 regression)
#   - chained writes: create issue → use issue.number in next call
#   - cleanup blocks deleting issues/gists at end of run
#
# Configure the fine-grained PAT scoped to a single dedicated test repo
# per the bot-account guidelines in tests/e2e/in-house-validation/README.md.
# The PAT MUST have Issues:write + Gists:write only; nothing else.

name: github-pat
prod: false
base_url: https://api.github.com
default_sla_ms: 5000

# Override the test repo at runtime so a clone of this sandbox doesn't
# point at the original author's account. Either set
# `APIWRIGHT_E2E_GH_TEST_REPO=owner/repo` in your env or edit this line.
test_repo: ${secret.APIWRIGHT_E2E_GH_TEST_REPO}

auth_strategies:
  github_pat:
    type: static_token
    token: ${secret.APIWRIGHT_E2E_GH_PAT}
    header: Authorization
    header_value: Bearer ${token}
