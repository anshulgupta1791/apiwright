# Environment: github-anon
#
# Targets https://api.github.com unauthenticated. GitHub's anonymous
# rate limit is 60 requests/hour per IP — generous for the few read-only
# endpoints exercised here. Used in Checkpoint C to exercise filters,
# pagination, cache headers, and GET idempotency against a real
# production-traffic API.

name: github-anon
prod: false
base_url: https://api.github.com
default_sla_ms: 5000
