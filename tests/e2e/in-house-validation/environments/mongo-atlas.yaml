# Environment: mongo-atlas
#
# Targets MongoDB Atlas Data API as the API under test (real HTTP) AND
# the same Atlas cluster as a real Mongo connection for db_verify.
# Free-tier M0 cluster, signed up at https://cloud.mongodb.com.
#
# Used in Checkpoint F to exercise the MongoDB connector via db_verify
# after writing through the Data API. The Atlas Data API URL pattern is
# https://data.mongodb-api.com/app/<app-id>/endpoint/data/v1.
#
# Credential setup:
#   1. Create free M0 cluster on Atlas
#   2. Create a database user with read/write on `apiwright_e2e` DB
#   3. Network Access: allow 0.0.0.0/0 (or CI runner IP range)
#   4. Capture the standard `mongodb+srv://...` connection string
#   5. Set APIWRIGHT_E2E_MONGO_URI to that connection string
#   6. (If using the Data API) capture the App's Endpoint URL and key
#      separately as APIWRIGHT_E2E_MONGO_DATA_URL + KEY

name: mongo-atlas
prod: false
base_url: ${secret.APIWRIGHT_E2E_MONGO_DATA_URL}
default_sla_ms: 8000

databases:
  primary_mongo:
    type: mongodb
    uri: ${secret.APIWRIGHT_E2E_MONGO_URI}
    database: apiwright_e2e

auth_strategies:
  mongo_data_api:
    type: static_token
    token: ${secret.APIWRIGHT_E2E_MONGO_DATA_KEY}
    header: api-key
    header_value: ${token}
