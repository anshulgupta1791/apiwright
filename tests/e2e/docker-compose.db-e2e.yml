# DEV/CI bring-up artifact for the §5 DB E2E tests.
#
# NOT auto-started by any test or vitest config.
# NOT referenced by configs/vitest.config.ts or configs/vitest.e2e.config.ts.
# Credentials are THROWAWAY LOCAL-ONLY — grant nothing beyond an ephemeral
# local container.
#
# Usage:
#   docker compose -f tests/e2e/docker-compose.db-e2e.yml up -d
#   export APIWRIGHT_E2E_PG_URL=postgres://apiwright:apiwright_local@127.0.0.1:5432/apiwright_e2e
#   export APIWRIGHT_E2E_MYSQL_URL=mysql://apiwright:apiwright_local@127.0.0.1:3306/apiwright_e2e
#   export APIWRIGHT_E2E_MONGO_URL=mongodb://127.0.0.1:27017/apiwright_e2e
#   export APIWRIGHT_E2E_NEO4J_URL=bolt://127.0.0.1:7687
#   export APIWRIGHT_E2E_NEO4J_USER=neo4j
#   export APIWRIGHT_E2E_NEO4J_PASSWORD=apiwright_local
#   npm run test:e2e

version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: apiwright
      POSTGRES_PASSWORD: apiwright_local
      POSTGRES_DB: apiwright_e2e
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apiwright -d apiwright_e2e"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: apiwright_root_local
      MYSQL_USER: apiwright
      MYSQL_PASSWORD: apiwright_local
      MYSQL_DATABASE: apiwright_e2e
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "apiwright",
             "--password=apiwright_local"]
      interval: 5s
      timeout: 5s
      retries: 15

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1})'"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/apiwright_local
    ports:
      - "7687:7687"
      - "7474:7474"
    healthcheck:
      test: ["CMD-SHELL",
             "cypher-shell -u neo4j -p apiwright_local 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
