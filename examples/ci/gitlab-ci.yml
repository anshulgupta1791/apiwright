# APIWright reference workflow for GitLab CI.
#
# Drop this file as `.gitlab-ci.yml` at the root of the repository that
# owns the endpoint + environment files. Replace the placeholders
# documented in `examples/README.md` before committing.
#
# Configure each `${secret.*}` reference as a GitLab CI/CD variable
# (Settings -> CI/CD -> Variables). Mask them and protect them as
# appropriate. The `variables` block below maps each one through to the
# container's environment.
#
# What this workflow does:
#   1. Uses the docker:24-cli image as the job runner so the `docker`
#      CLI is available; binds to a Docker-in-Docker service for the
#      daemon.
#   2. Pulls the published APIWright Docker image and runs the suite
#      against `--env=qa --markers=smoke,regression`.
#   3. Archives the entire `reports/` directory as build artifacts so
#      the HTML report + JSON sidecar are downloadable for 30 days.
#   4. Registers `reports/*.xml` as a JUnit report so GitLab's merge
#      request widget shows the pass/fail summary inline.

stages:
  - test

apiwright:
  stage: test
  image: docker:24-cli
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    # The four QA_* values must be configured as GitLab CI/CD variables.
    # They are intentionally NOT defined here — they get injected by
    # GitLab at job time so secrets never appear in the YAML.
  before_script:
    - mkdir -p reports
  script:
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR/tests:/app/tests:ro" \
        -v "$CI_PROJECT_DIR/environments:/app/environments:ro" \
        -v "$CI_PROJECT_DIR/reports:/app/reports" \
        -e QA_DB_USER \
        -e QA_DB_PASSWORD \
        -e QA_USER \
        -e QA_PASSWORD \
        ghcr.io/<org>/apiwright:1.0.0 \
        run --env=qa --markers=smoke,regression
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/
    reports:
      junit: reports/*.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
