rules:
  - id: security-audit-rules
    patterns:
      - pattern-either:
          # Detect potential secret exposure
          - patterns:
              - pattern: |
                  $KEY = "..."
              - metavariable-pattern:
                  metavariable: $KEY
                  patterns:
                    - pattern-either:
                        - pattern: /.*[Pp]assword.*/
                        - pattern: /.*[Ss]ecret.*/
                        - pattern: /.*[Aa]pi[Kk]ey.*/
                        - pattern: /.*[Tt]oken.*/
          # Detect eval/exec usage
          - pattern-either:
              - pattern: eval(...)
              - pattern: exec(...)
              - pattern: Function(...)
    message: Potential security issue detected
    languages: [typescript, javascript]
    severity: WARNING

  - id: no-implicit-any-param
    patterns:
      - pattern: |
          function $FUNC($ARG: any) { ... }
    message: Avoid `any` in function parameters; use a precise type or `unknown`.
    languages: [typescript, javascript]
    severity: INFO

  # Untrusted input must be parsed through the single audited boundary
  # src/core/safe-json.ts (parseJson), which never throws and returns a
  # typed Result. Raw JSON.parse anywhere else is a finding. Only the
  # audited file itself is excluded.
  - id: raw-json-parse
    patterns:
      - pattern: JSON.parse(...)
    paths:
      exclude:
        - "src/core/safe-json.ts"
    message: >-
      Use parseJson() from src/core (the audited safe-JSON boundary)
      instead of raw JSON.parse, so untrusted input is parsed in one
      reviewed, non-throwing place.
    languages: [typescript, javascript]
    severity: INFO
