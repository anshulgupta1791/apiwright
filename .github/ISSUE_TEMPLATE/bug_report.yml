name: 🐛 Bug report
description: APIWright is doing something it shouldn't, or not doing something it should.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Before submitting, please:
        - Search [open + closed issues](https://github.com/anshulgupta1791/apiwright/issues?q=is%3Aissue) for duplicates.
        - Check [docs/troubleshooting.md](https://github.com/anshulgupta1791/apiwright/blob/main/docs/troubleshooting.md) for known errors.
        - Check [docs/limitations.md](https://github.com/anshulgupta1791/apiwright/blob/main/docs/limitations.md) — your case might be a known limitation.
        - For security-relevant bugs, use [Private Vulnerability Reporting](https://github.com/anshulgupta1791/apiwright/security/advisories/new) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, concise description of what went wrong.
      placeholder: When I run `apiwright run --env qa`, the X case fails with Y, but I expected Z.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: |
        The smallest declaration + env YAML + CLI command that reproduces the bug. Inline them here; we'll work from your reproduction.
      render: text
      placeholder: |
        // tests/repro.endpoint.json
        { "id": "...", ... }

        // environments/repro.yaml
        name: repro
        ...

        // CLI
        apiwright run --env repro --markers smoke --log debug
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected APIWright to do instead.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log output / report
      description: |
        Paste the relevant log lines (especially with `--log debug`) and/or the relevant excerpt from `reports/run-*.json`. Redact anything sensitive yourself before pasting.
      render: text
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: APIWright version
      description: Output of `apiwright --version`.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: "v22.10.0"
    validations:
      required: true

  - type: dropdown
    id: install-route
    attributes:
      label: How did you install APIWright?
      options:
        - Docker (ghcr.io/anshulgupta1791/apiwright)
        - npm
        - From source (git clone)
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 14.4 / Ubuntu 22.04 / Windows 11 / etc.
    validations:
      required: true
