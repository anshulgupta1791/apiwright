id: cli-deferred-command-seams
title: Define typed seams for run, import, and docs commands
description: |
  Define clean TypeScript interfaces (injection points) for the operations
  that belong to not-yet-built engines: the test runner (Task #10), the
  Postman importer (Task #4), the OpenAPI importer (Task #5), and the docs
  generator (Task #11). Provide default seam implementations that throw the
  not-yet-implemented error from cli-error-and-exit-codes. No engine code is
  written or imported here; only the contracts and stub bindings.
acceptance_criteria:
  - "A `TestRunner` interface (input: resolved env name, markers, log level,
    effective config) is exported; its default binding throws the
    not-yet-implemented error naming Task #10."
  - "An `Importer` interface covering postman(file, outputDir) and
    openapi(urlOrFile, outputDir) is exported; the default bindings throw the
    not-yet-implemented error naming Task #4 (postman) and Task #5 (openapi)."
  - "A `DocsGenerator` interface (input: source dir, output dir) is exported;
    its default binding throws the not-yet-implemented error naming Task #11."
  - No module under src/cli imports from src/importers, src/runner, or
    src/docs-generator (verified: those paths do not exist yet).
  - Each interface is fully typed using the existing ApiwrightConfig and
    src/env ResolvedEnvironment types where relevant, so the future engines
    can implement them without CLI changes.
  - Default bindings are injectable so cli-command-wiring and tests can
    substitute a fake implementation to assert delegation occurs.
dependencies:
  - cli-config-types-and-schema
  - cli-error-and-exit-codes
estimated_complexity: small
affected_modules:
  - src/cli/seams/test-runner.ts
  - src/cli/seams/importer.ts
  - src/cli/seams/docs-generator.ts
  - src/cli/index.ts
