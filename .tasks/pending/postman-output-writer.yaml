id: postman-output-writer
title: Write endpoint files into subdirectories mirroring Postman folders
description: |
  Given validated CanonicalEndpoint objects each tagged with their Postman
  folder-path segments, write one `.endpoint.json` file per request under
  outputDir, creating subdirectories that mirror the Postman folder hierarchy.
  Filenames derive from the request name (snake-cased, filesystem-safe). All
  disk access goes through the ImporterFileSystem seam.
acceptance_criteria:
  - "An endpoint whose folder path is [`Users`, `Admin`] is written to
    `<outputDir>/users/admin/<request_name>.endpoint.json`."
  - "An endpoint with an empty folder path is written directly under
    `<outputDir>`."
  - "Directory segments and filenames are sanitized to a safe charset; two
    requests resolving to the same target path are disambiguated
    deterministically (e.g. numeric suffix) and a warning notes the rename."
  - "File contents are stable, pretty-printed JSON of the CanonicalEndpoint
    (deterministic key order so re-import is diff-clean)."
  - "All directory creation and file writes go through the ImporterFileSystem
    seam; tests assert paths and contents without real disk."
  - "Returns the count of files successfully written plus any rename
    warnings; never throws on a name collision."
dependencies:
  - postman-importer-types-and-fs-seam
  - postman-endpoint-assembler-and-validation
estimated_complexity: small
affected_modules:
  - src/importers/postman/output-writer.ts
  - src/importers/postman/path-naming.ts
