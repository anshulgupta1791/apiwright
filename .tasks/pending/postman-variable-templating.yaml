id: postman-variable-templating
title: Rewrite Postman {{var}} references into ${env.*} templating
description: |
  Convert Postman variable/environment references of the form {{var}} into the
  framework's canonical ${env.var} template syntax across URL, headers, query
  params, and request body strings. Collection/folder/request scoped variables
  are recognized. The output template syntax must match what src/env's
  ${env.*} resolver consumes so imported endpoints work at run time.
acceptance_criteria:
  - "`{{baseUrl}}/users` becomes `${env.baseUrl}/users`."
  - "A header value `Bearer {{token}}` becomes `Bearer ${env.token}`."
  - "Multiple references in one string (e.g. `{{a}}-{{b}}`) are each rewritten
    to `${env.a}-${env.b}`."
  - "A variable name with characters illegal in the ${env.*} grammar (the
    resolver accepts dot-separated [A-Za-z0-9_]+) is sanitized to a legal
    name and a warning records the original->rewritten mapping."
  - "Strings containing no {{var}} references are returned unchanged."
  - "Unbalanced braces (e.g. `{{oops`) are left literal and a warning is
    emitted; no exception is thrown."
  - "Rewriting is pure (does not mutate the input FlattenedRequest) and
    returns the rewritten copy plus any warnings."
dependencies:
  - postman-importer-types-and-fs-seam
estimated_complexity: medium
affected_modules:
  - src/importers/postman/variable-templating.ts
