id: cli-flag-override-merge
title: Merge CLI flags over loaded config for a single run
description: |
  Provide a pure resolver that takes a validated ApiwrightConfig plus the
  parsed CLI flag values for one invocation and produces the effective
  per-run settings. CLI flags override config values for that run only; the
  on-disk config is never mutated. Only flags actually supplied on the command
  line override; absent flags leave the config value intact.
acceptance_criteria:
  - "Given config default_env=qa and CLI --env=prod, the resolved env is
    prod; with no --env flag the resolved env is qa."
  - "Given config default_markers=[smoke] and CLI --markers=smoke,regression,
    the resolved markers are [smoke, regression]; with no --markers flag the
    resolved markers are [smoke]."
  - "Given config log_level=warn and CLI --log=debug, the resolved log level
    is debug; with no --log flag it stays warn."
  - "An explicitly-passed flag whose value equals the config value is treated
    as an override (no-op effect) without error."
  - The resolver is pure: it returns a new effective-settings object and does
    not mutate the input config or flag objects.
  - "--markers parsing accepts the spec forms: comma-separated list and the
    literal `all` (expands to smoke,regression,e2e); invalid marker names
    return a clear error rather than silently passing through."
dependencies:
  - cli-config-loader
estimated_complexity: small
affected_modules:
  - src/cli/config/resolve-effective.ts
  - src/cli/index.ts
