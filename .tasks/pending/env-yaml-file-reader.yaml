id: env-yaml-file-reader
title: Read and safe-parse environment YAML files from disk
description: |
  Load a single environment YAML file (e.g. environments/qa.yaml or
  .env.qa.yaml) using js-yaml safe-load only, returning the raw parsed object
  or a structured error for missing-file / unreadable / malformed-YAML cases.
acceptance_criteria:
  - Reading a well-formed YAML env file returns the parsed object.
  - Reading a non-existent path returns a structured error stating the path
    that was not found (no unhandled exception).
  - Reading a file containing invalid YAML returns a structured error that
    includes the YAML parser's line/column message.
  - Parsing uses js-yaml safe-load (no arbitrary type construction); a YAML
    document with a custom/unsafe tag does not execute code and is rejected.
  - Empty file yields a structured error rather than a null silently passed on.
dependencies:
  - env-config-types-and-schema
estimated_complexity: small
affected_modules:
  - src/env/yaml-reader.ts
