id: postman-importer-cli-wiring
title: Wire the real Postman importer into CLI default deps, keep openapi deferred
description: |
  Replace the `NotImplementedImporter` in entry.ts's makeDefaultDeps with a
  composed Importer whose `postman()` delegates to the real PostmanImporter and
  whose `openapi()` still rejects with NotImplementedError naming Task #5.
  The Importer interface (src/cli/seams/importer.ts) and ImportCommand are NOT
  changed. This is the single integration point that makes
  `apiwright import postman` functional while keeping `import openapi`
  explicitly not-implemented until Task #5.
acceptance_criteria:
  - "A `CompositePostmanImporter` (or equivalently named composed Importer)
    implements the `Importer` interface: `postman()` delegates to
    `PostmanImporter`; `openapi()` returns a rejected promise with
    `NotImplementedError(\"`apiwright import openapi`\", 5)`."
  - "entry.ts `makeDefaultDeps` constructs this composed importer instead of
    `NotImplementedImporter`; no other entry.ts wiring changes."
  - "An entry-level test driving `apiwright import postman <fixture>
    --output <tmp>` exits 0 and writes endpoint files (delegation reaches the
    real importer)."
  - "An entry-level test driving `apiwright import openapi <x> --output <tmp>`
    still exits with the NOT_IMPLEMENTED code and a message naming Task #5."
  - "`src/cli/seams/importer.ts` and `src/cli/commands/import.ts` are
    unmodified (verified by diff scope: changes confined to src/importers and
    src/cli/entry.ts)."
  - "The composed importer class is unit-tested directly for both the
    delegating `postman` path and the rejecting `openapi` path; default-seam
    construction (no injected PostmanImporter) is covered, not
    istanbul-ignored."
dependencies:
  - postman-importer-orchestrator
estimated_complexity: small
affected_modules:
  - src/importers/composite-importer.ts
  - src/importers/index.ts
  - src/cli/entry.ts
