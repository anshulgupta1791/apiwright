id: cli-config-types-and-schema
title: Define apiwright.config.json TypeScript types and validation schema
description: |
  Establish the canonical TypeScript interface for the parsed
  apiwright.config.json (tests_dir, environments_dir, reports_dir, default_env,
  default_markers, log_level, workers, retry{count,delay_ms,backoff,strict},
  report{html,json,junit_xml,output_dir}) plus an AJV-backed schema validator
  returning a { valid, errors } result. This is the type and validation
  foundation every other CLI sub-task builds on. No file reading or merging
  here; this is types + schema only.
acceptance_criteria:
  - "An `ApiwrightConfig` interface (and supporting `RetryConfig`,
    `ReportConfig` interfaces) is exported from src/cli so the loader, command
    handlers, and the deferred run/import/docs seams can consume it."
  - The schema validator rejects a config whose `log_level` is not one of
    error/warn/info/debug with a message naming the field and bad value.
  - The schema validator rejects a config whose `retry.backoff` is not one of
    none/linear/exponential with a clear enum-violation message.
  - The schema validator rejects a config whose `workers` is not a positive
    integer with a message naming the field.
  - The schema validator rejects a config whose `default_markers` is not an
    array of smoke/regression/e2e with a clear message.
  - A config matching the V1_BUILD_SPEC.md example (lines 706-727) passes
    validation with zero errors and yields a typed `ApiwrightConfig`.
  - The validator returns the existing { valid, errors } shape and uses the
    AJV-via-require + errorMessage convention from src/core and src/env.
dependencies: []
estimated_complexity: small
affected_modules:
  - src/cli/config/types.ts
  - src/cli/config/schema.ts
  - src/cli/index.ts
