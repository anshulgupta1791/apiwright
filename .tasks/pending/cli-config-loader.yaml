id: cli-config-loader
title: Load and validate apiwright.config.json with defaults
description: |
  Provide a config loader that locates apiwright.config.json in the repo root,
  parses it, validates it against the schema, and fills in documented defaults
  for any omitted keys. Returns a structured { valid, config, errors } result;
  never throws raw exceptions for user-config problems. A missing config file
  is not an error: the loader returns the full default config.
acceptance_criteria:
  - "Loading from a directory containing a valid apiwright.config.json returns
    valid=true and a fully-populated config (all keys present, defaults filled
    for omitted ones)."
  - "Loading from a directory with NO apiwright.config.json returns valid=true
    with the documented default config (default_env=qa,
    default_markers=[smoke], log_level=warn, workers=8, etc. per spec example)."
  - A config file containing malformed JSON returns valid=false with a
    human-readable parse error naming the file; does not throw.
  - A config file failing schema validation returns valid=false with the
    aggregated schema errors from cli-config-types-and-schema; does not throw.
  - The loader accepts an injectable root directory and file-reader seam so
    tests are deterministic without touching the real filesystem.
  - The resolved config object is returned typed as `ApiwrightConfig`.
dependencies:
  - cli-config-types-and-schema
estimated_complexity: small
affected_modules:
  - src/cli/config/loader.ts
  - src/cli/index.ts
