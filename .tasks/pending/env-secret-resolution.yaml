id: env-secret-resolution
title: Resolve ${secret.*} references from process.env with fail-fast validation
description: |
  Implement the secrets resolver: scan a parsed config for ${secret.NAME}
  tokens and resolve each from process.env. Per V1_BUILD_SPEC.md §8,
  ${secret.API_KEY} maps to process.env.API_KEY (no prefix). Missing or empty
  secrets fail fast at startup with an aggregated error listing every
  unresolved reference. Maintain an in-memory registry of resolved secret
  values for later log redaction.
acceptance_criteria:
  - "${secret.API_KEY} resolves to the value of process.env.API_KEY."
  - A reference whose mapped env var is unset produces a startup error naming
    the reference and the env var it expected (e.g. API_KEY).
  - A reference whose mapped env var is an empty string is treated as missing
    and reported the same way.
  - Multiple missing secrets are reported together in one aggregated error,
    not one-at-a-time.
  - Resolved secret values are recorded in an in-memory registry exposing the
    set of resolved values (for the redactor consumed by reporters/runner).
  - Secret values never appear in thrown error messages or returned validation
    text.
dependencies:
  - env-config-types-and-schema
estimated_complexity: medium
affected_modules:
  - src/env/secrets.ts
