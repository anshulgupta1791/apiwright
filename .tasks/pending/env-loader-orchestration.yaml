id: env-loader-orchestration
title: Provide EnvironmentLoader class orchestrating read, resolve, validate
description: |
  Compose the YAML reader, schema validator, secret resolver, and template
  resolver into a single EnvironmentLoader class. It exposes methods to load an
  environment by name (selecting the right .env.<name>.yaml), apply
  per-environment overrides, resolve all ${env.*} and ${secret.*} references,
  validate the final config against the schema, and validate that database /
  auth-strategy connection names referenced are internally consistent. Returns
  a structured validation result with clear, aggregated error messages on
  startup; never throws raw exceptions for user-config problems.
acceptance_criteria:
  - "EnvironmentLoader.load('qa') reads .env.qa.yaml (or environments/qa.yaml),
    resolves templates and secrets, and returns a fully resolved env object."
  - Loading an environment whose file fails schema validation returns a result
    with valid=false and a list of human-readable errors (does not throw).
  - Loading an environment with missing secrets returns valid=false with the
    aggregated missing-secret errors.
  - Per-environment overrides merge over base values (override wins; deep merge
    for nested objects like databases).
  - The loader validates that every db connection / auth_strategy key is a
    well-formed name and reports duplicates or empty names.
  - A successful load returns valid=true plus the resolved environment typed as
    ResolvedEnvironment, ready for CLI (#3) and runner (#10) consumption.
  - The loader exposes the resolved-secret registry so downstream redaction can
    use it.
dependencies:
  - env-yaml-file-reader
  - env-secret-resolution
  - env-template-resolution
estimated_complexity: medium
affected_modules:
  - src/env/loader.ts
  - src/env/index.ts
